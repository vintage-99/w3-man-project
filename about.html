<h2>student grading system</h2>

<label>enter your score(0-100): </label>
<input type="text" id="score" placeholder="enter your score here">
<button onclick="checkgrade()">check grade</button>

<p class="result"></p>

<script>
    function vintage(score) {
        let grade
        let fedback

        if (score >= 70 && score <= 100){
            grade = "A"
            feedback = "excellent grade"}

        else if (score >= 60 && score <= 69){
            grade = "B"
            feedback = "good grade"}
        else if (score >= 50 && score <= 59){
            grade = "C"
            feedback = "you passed but make room for improvement"
        }
        else if (score >= 40 && score <= 49){
            grade = "D"
            feedback = "Study harder"
        }
        else if (score >= 0 && score <= 39){
            grade = "F"
            feedback = "failed"
        } 
        else {
            return 'enter a numerical value  between 0-100 '
            
        }

        return `your grade is ${grade} ${feedback}`
    }
    
    function checkgrade(){
        let userscore = document.getElementById('score').value
        userscore = Number (userscore)
        let message = vintage(userscore)
        let result = document.getElementsByClassName('result')[0]
        result.innerHTML = message;
    }
</script>
